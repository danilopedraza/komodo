name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ci:
    uses: ./.github/workflows/core-ci.yml
  version:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Read package version
        id: version
        run: echo "version=v$(nix eval --raw .#komodo.version)" >> "$GITHUB_OUTPUT"
  build:
    needs: [ci, version]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - run: nix build .#komodo-release -L
      - run: nix run .#smoke
      - name: Stage binary
        run: |
          mkdir -p artifacts
          cp result/bin/komodo artifacts/komodo-${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: komodo-${{ matrix.name }}
          path: artifacts/komodo-${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: utils.komodo
          path: std/utils.komodo
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          files: artifacts/**
