name: CI
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'core/**'
      - 'core-browser/**'
      - 'std/**'
      - 'examples/**'
      - 'bench/**'
      - 'book/**'
      - 'report/**'
      - 'website/**'
      - 'installer/linux/install.sh'
      - 'vsc-extension/**'
      - 'nix/**'
      - 'flake.nix'
      - 'flake.lock'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'core/**'
      - 'core-browser/**'
      - 'std/**'
      - 'examples/**'
      - 'bench/**'
      - 'book/**'
      - 'report/**'
      - 'website/**'
      - 'installer/linux/install.sh'
      - 'vsc-extension/**'
      - 'nix/**'
      - 'flake.nix'
      - 'flake.lock'
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  check:
    name: Nix checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - run: nix flake check -L
