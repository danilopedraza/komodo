name: Interpreter benchmarks
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v30
      - uses: cachix/magic-nix-cache-action@v13
      - name: Run benchmarks
        run: nix run .#bench -- "${PREVIOUS_COMMIT:-$(git rev-parse HEAD^)}"
        env:
          PREVIOUS_COMMIT: ${{ vars.SECOND_TO_LAST_PUSH_HASH }}
          BENCHER_API_TOKEN: ${{ secrets.BENCHER_API_TOKEN }}
      - name: Record benchmarked revision
        run: nix run .#record-benchmark
        env:
          GH_TOKEN: ${{ secrets.REPO_VAR_PAT }}
