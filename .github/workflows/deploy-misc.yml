name: Deploy website
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-misc.yml'
      - 'website/**'
      - 'core/**'
      - 'core-browser/**'
      - 'book/**'
      - 'report/**'
      - 'installer/linux/install.sh'
      - 'flake.nix'
      - 'flake.lock'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy-website:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Build site
        run: |
          nix build .#website -L
          cp -rL result site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
